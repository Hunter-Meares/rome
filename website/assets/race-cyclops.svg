    <rect x="100" y="98" width="18" height="14" rx="2" transform="rotate(-45 109 105)"/>
  </g>
  <!-- single eye -->
  <ellipse cx="100" cy="90" rx="26" ry="18" fill="#0d0d0f" stroke="#d4af37" stroke-width="3"/>
  <circle cx="100" cy="90" r="9" fill="#d4af37"/>
