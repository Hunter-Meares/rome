  <circle cx="100" cy="100" r="80" fill="none" stroke="#a98623" stroke-width="1.5"/>
  <g fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round">
    <!-- staff -->
    <line x1="100" y1="55" x2="100" y2="150"/>
